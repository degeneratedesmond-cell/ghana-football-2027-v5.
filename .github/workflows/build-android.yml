
name: Build GHANA FOOTBALL 2027 V5

on:
  workflow_dispatch:
  push:
    paths:
      - "*.zip"
      - ".github/workflows/build-android.yml"

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android components
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Extract V5 ZIP
        run: |
          mkdir project_files
          ZIP=$(find . -maxdepth 1 -name "*.zip" | head -1)
          test -n "$ZIP"
          unzip -q "$ZIP" -d project_files
          PROJECT=$(find project_files -name project.godot -printf '%h\n' | head -1)
          test -n "$PROJECT"
          echo "PROJECT=$PROJECT" >> "$GITHUB_ENV"

      - name: Install Godot 4.3
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          unzip -q Godot_v4.3-stable_linux.x86_64.zip
          chmod +x Godot_v4.3-stable_linux.x86_64
          echo "GODOT=$PWD/Godot_v4.3-stable_linux.x86_64" >> "$GITHUB_ENV"

      - name: Install Godot export templates
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz
          mkdir -p ~/.local/share/godot/export_templates/4.3.stable
          unzip -q Godot_v4.3-stable_export_templates.tpz -d /tmp/godot-templates
          cp -a /tmp/godot-templates/templates/. ~/.local/share/godot/export_templates/4.3.stable/

      - name: Configure Android signing
        run: |
          mkdir -p ~/.android
          keytool -genkeypair -v \
            -keystore ~/.android/debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -dname "CN=Android Debug,O=Android,C=US" \
            -keyalg RSA -keysize 2048 -validity 10000

      - name: Configure Godot Android SDK
        run: |
          mkdir -p ~/.config/godot
          cat > ~/.config/godot/editor_settings-4.3.tres <<EOF
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/java_sdk_path = "/usr/lib/jvm/temurin-17-jdk-amd64"
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/debug_keystore = "$HOME/.android/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF

      - name: Import project
        run: |
          "$GODOT" --headless --editor --path "$PROJECT" --import

      - name: Build Android APK
        run: |
          mkdir -p "$PROJECT/build"
          "$GODOT" --headless --path "$PROJECT" \
            --export-debug "Android Phones + Tablets" \
            "$PROJECT/build/GHANA_FOOTBALL_2027_V5.apk"

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: GHANA-FOOTBALL-2027-V5-APK
          path: project_files/**/build/*.apk
          if-no-files-found: error
